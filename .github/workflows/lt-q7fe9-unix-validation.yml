name: lt-q7fe9 Unix and metadata validation
on:
  push:
    branches: [lt-q7fe9-unix-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 754f7ad7b86a7cb256d5eb03973be7d79d705398
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Record source
        run: |
          mkdir -p validation-artifacts
          git rev-parse HEAD > validation-artifacts/source.txt
      - name: Run existing core hook integration cases
        run: |
          set -euo pipefail
          just test -p codex-core --test all --locked -E 'test(suite::hooks::)' 2>&1 | tee validation-artifacts/core-hooks.txt
      - name: Scoped lint fixes
        if: always()
        run: |
          set -euo pipefail
          just fix -p codex-hooks -p codex-utils-pty --locked 2>&1 | tee validation-artifacts/clippy.txt
          git diff > validation-artifacts/clippy.patch
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: lt-q7fe9-unix-validation
          path: validation-artifacts/
          retention-days: 7
