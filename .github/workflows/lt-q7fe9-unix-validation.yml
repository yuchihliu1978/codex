name: lt-q7fe9 Unix and metadata validation
on:
  push:
    branches: [lt-q7fe9-unix-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a566b5581a82e4abda556c6e8d350cdd950b4647
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0,cargo-nextest,bazelisk
      - name: Regenerate dependency metadata
        run: |
          mkdir -p validation-artifacts
          git rev-parse HEAD > validation-artifacts/source.txt
          just bazel-lock-update 2>&1 | tee validation-artifacts/bazel-lock.txt
          git diff -- MODULE.bazel.lock > validation-artifacts/bazel-lock.patch
      - name: Normalize release tag lock versions in build workspace only
        working-directory: codex-rs
        shell: python
        run: |
          from pathlib import Path
          import tomllib
          p = Path('Cargo.lock')
          blocks = p.read_text().split('[[package]]')
          changed = []
          for i, block in enumerate(blocks[1:], 1):
              package = tomllib.loads('[[package]]' + block)['package'][0]
              if 'source' not in package and package['version'] == '0.0.0':
                  blocks[i] = block.replace('version = "0.0.0"', 'version = "0.157.1"', 1)
                  changed.append(package['name'])
          assert len(changed) == 155
          p.write_text('[[package]]'.join(blocks))
      - name: Run affected Unix crate tests
        run: |
          just test -p codex-hooks -p codex-utils-pty --locked 2>&1 | tee validation-artifacts/unix-tests.txt
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: lt-q7fe9-unix-validation
          path: validation-artifacts/
          retention-days: 7
